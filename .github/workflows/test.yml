name: Test

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - main

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build demuxolotl
        run: make
      - name: Demultiplex test files
        run: |
            bin/demuxolotl --threads 4 testing test/gih.R*.gz &&\
            zcat testing.R1.fq.gz | head
      - name: Demultiplex with QX RX tags
        run: |
            bin/demuxolotl --qx-rx testing test/gih.R*.gz &&\
            zcat testing.R1.fq.gz | head
      - name: Demultiplex with ME-discard output
        run: |
            bin/demuxolotl -d testing test/gih.R*.gz &&\
            zcat testing.noME.fq.gz | head
